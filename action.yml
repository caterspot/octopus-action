# action.yml
name: 'Caterspot Deployment'
description: 'Caterspot Deployment'
author: 'Faizal Zakaria'
inputs:
  app:
    description: 'Name of the app, ex: caterspot_admin_app'
    required: true
  aws_key:
    description: 'AWS key'
    required: true
  aws_secret:
    description: 'AWS Secret'
    required: true
  github_key:
    description: 'Github key'
    required: true
  environment:
    description: 'App environment'
  bastion_user:
    description: 'Bastion User'
  bastion_host:
    description: 'Bastion Host'
  octopus_repo:
    description: 'Octopus Repo | Capistrano Deployment repo'
  octopus_branch:
    description: 'Octopus Branch'
  bastion_ssm_tag:
    description: 'Value of the bastion EC2 instance''s Name tag, to tunnel through via AWS SSM Session Manager (omit to use direct SSH to bastion_host). Resolved to an instance ID at deploy time, so this keeps working across instance replacement.'
  bastion_ssm_region:
    description: 'AWS region the bastion_ssm_tag instance lives in (required when bastion_ssm_tag is set)'

outputs:
  result:
    description: 'Result'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.app }}
    - ${{ inputs.aws_key }}
    - ${{ inputs.aws_secret }}
    - ${{ inputs.github_key }}
    - ${{ inputs.environment }}
    - ${{ inputs.bastion_user }}
    - ${{ inputs.bastion_host }}
    - ${{ inputs.octopus_repo }}
    - ${{ inputs.octopus_branch || 'master' }}
    - ${{ inputs.bastion_ssm_tag }}
    - ${{ inputs.bastion_ssm_region }}
